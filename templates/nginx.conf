# DS7 static site on nginx (used by templates/Dockerfile; also works on a plain server as a site config).
# Serves the output of `nuxt generate`: pre-compressed files, the 404 page, cache and security headers.
# Rules and reasons: ds7/03-performance-web-vitals/DELIVERY-AND-CACHING.md and ds7/09-security-errors/SECURITY-AND-ERRORS.md.
# A change to a header value is recorded in docs/DECISIONS.md.

# One Cache-Control value per kind of file. Hashed build files never change; HTML is always revalidated.
map $uri $ds7_cache_control {
    ~^/_nuxt/                                  "public, max-age=31536000, immutable";
    ~\.html$                                   "public, max-age=0, must-revalidate";
    ~/$                                        "public, max-age=0, must-revalidate";
    ~\.(?:avif|webp|jpe?g|png|gif|svg|ico|woff2)$ "public, max-age=604800, stale-while-revalidate=86400";
    default                                    "public, max-age=3600";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;   # correct redirects behind a proxy or a mapped port
    server_tokens off;

    # Pre-compressed .gz files written by nitro.compressPublicAssets; on-the-fly gzip for anything else.
    # Brotli needs the ngx_brotli module, which nginx:alpine does not include: put a CDN or Caddy in front for .br.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header Cache-Control $ds7_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    # Enable after the steps in SECURITY-AND-ERRORS.md section 1 (Report-Only first; HTTPS on every subdomain):
    # add_header Content-Security-Policy "default-src 'self'; ..." always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Unknown routes get the site's own 404 page with status 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
