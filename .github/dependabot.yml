# Weekly updates of the actions used by the workflows and of the development packages, grouped into one pull request each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: build
      include: scope
