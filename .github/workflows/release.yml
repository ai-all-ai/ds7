name: GitHub release

# For a version tag: the GitHub Release (notes from the CHANGELOG.md section of that version), then the npm package,
# then the Homebrew formula.
# - npm: trusted publishing with provenance, no token in the repository. Set it up once on npmjs.com (package settings,
#   "Trusted publisher": this repository, workflow release.yml, environment npm). The environment "npm" can require an
#   approval in the repository settings, so nothing is published without a click.
# - Homebrew: a repository_dispatch to ai-all-ai/homebrew-tap, which updates its formula. Needs the secret TAP_DISPATCH_TOKEN
#   (a fine-grained token with contents: write on the tap); without it the step is skipped.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Check the tag matches package.json
        run: |
          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "tag $TAG does not match package.json $package_version" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG section for $version" >&2; exit 1; }

      - name: Create or update the release
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          title="DS7 $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
          else
            gh release create "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease
          fi

  npm:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Publish with provenance
        run: |
          tag=latest
          [[ "$GITHUB_REF_NAME" == *-* ]] && tag=next
          npm publish --provenance --access public --tag "$tag"

  homebrew:
    needs: npm
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Ask the tap to update the ds7 formula
        env:
          TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "TAP_DISPATCH_TOKEN is not set: the tap picks the version up on its own schedule"; exit 0; fi
          curl -fsS -X POST https://api.github.com/repos/ai-all-ai/homebrew-tap/dispatches \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"formula-update\",\"client_payload\":{\"formula\":\"ds7\",\"version\":\"${GITHUB_REF_NAME#v}\"}}"
