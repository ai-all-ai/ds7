name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # a full run takes about two minutes: a hung job stops here instead of after six hours
    timeout-minutes: 10
    strategy:
      # one failing cell does not cancel the others, so every system reports its own result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24]
        # one Windows cell: paths, line ends and links behave differently there
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # The integration test installs a local build of @ai.all/aiall, so DS7 is
      # tested against the AI-ALL code in the repository, not a published version.
      - uses: actions/checkout@v6
        with:
          repository: ai-all-ai/aiall
          path: aiall
      - name: Pin AI-ALL to the version DS7 depends on
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').dependencies['@ai.all/aiall']" | sed 's/^[\^~]//')"
          git -C aiall fetch --tags --quiet
          git -C aiall checkout --quiet "v$version"
          echo "AI-ALL pinned to v$version"
      - name: Pack AI-ALL for the integration test
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/aiall-pack"
          mkdir -p "$dir"
          cd "$GITHUB_WORKSPACE/aiall"
          npm pack --pack-destination "$dir" --json > "$dir/pack.json"
          # the path goes in through the environment: on Windows it has backslashes,
          # which a JavaScript string literal would read as escapes
          PACK_DIR="$dir" node -e '
            const path = require("path");
            const dir = process.env.PACK_DIR;
            const [{ filename }] = JSON.parse(require("fs").readFileSync(path.join(dir, "pack.json"), "utf8"));
            console.log("AIALL_TARBALL=" + path.join(dir, filename));
          ' >> "$GITHUB_ENV"

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: npm run format:check
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run
